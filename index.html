<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Portfolio — Junior Full Stack Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Tasfiq — Junior Full Stack Software Engineer focused on React, TypeScript, C#, ASP.NET Core, and SQL Server."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tasfiq — Junior Full Stack Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Tasfiq — Junior Full Stack Software Engineer focused on React, TypeScript, C#, ASP.NET Core, and SQL Server."
    />
    <!-- Apply saved theme before first paint (dark is the default). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('portfolio-theme') === 'light') {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f6f7fb');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
